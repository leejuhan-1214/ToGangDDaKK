name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build static site
        run: |
          node --check build.mjs
          node --check live-app.mjs
          node --check live-viewport.mjs
          node --check observation-data.mjs
          node --check landcover-data.mjs
          node --check unccd-reference.mjs
          node --check degradation-data.mjs
          node --check app.mjs
          node --check model.mjs
          node --check viewport.mjs
          node --check analysis.worker.mjs
          node --check land-mask.mjs
          node --check ui-controls.mjs
          node --check history-view.mjs
          node --check explanation.mjs
          node --check presentation.mjs
          node --test model.test.mjs viewport.test.mjs water.test.mjs land-mask.test.mjs explanation.test.mjs presentation.test.mjs history.test.mjs observation-data.test.mjs landcover.test.mjs unccd-reference.test.mjs degradation-data.test.mjs live-viewport.test.mjs
          node build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

